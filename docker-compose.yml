services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: case
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: case
      TZ: Africa/Harare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case"]
      interval: 10s
      retries: 5

  core:
    build: ./apps/core
    environment:
      DATABASE_URL: postgres://case:${POSTGRES_PASSWORD}@postgres:5432/case
      CASE_API_KEY: ${CASE_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CASE_REPOS: ${CASE_REPOS}
      TZ: Africa/Harare
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: case
      DB_POSTGRESDB_USER: case
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Africa/Harare
      TZ: Africa/Harare
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata: