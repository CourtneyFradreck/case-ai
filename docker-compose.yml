services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: case
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: case
      TZ: Africa/Harare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case"]
      interval: 10s
      retries: 5

  core:
    build: ./apps/core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://case:${POSTGRES_PASSWORD}@postgres:5432/case
      CASE_API_KEY: ${CASE_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CASE_REPOS: ${CASE_REPOS}
      CASE_BRANCH_EXCLUDE: ${CASE_BRANCH_EXCLUDE:-pr-assets/*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CASE_BRIEF_MODE: ${CASE_BRIEF_MODE:-rules}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CASE_DELIVERY: ${CASE_DELIVERY:-n8n}
      TZ: Africa/Harare
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: case
      DB_POSTGRESDB_USER: case
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Africa/Harare
      TZ: Africa/Harare
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    build: ./infra/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: case
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: case
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_FAILURE_WEBHOOK: ${BACKUP_FAILURE_WEBHOOK:-}
      # rclone remote "r2" (Cloudflare R2), configured without a config file.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      TZ: Africa/Harare
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
